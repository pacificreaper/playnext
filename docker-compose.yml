services:
  neo4j:
    image: neo4j:5-community
    container_name: playnext-neo4j

    ports:
      - "7474:7474"
      - "7687:7687"

    environment:
      NEO4J_AUTH: neo4j/playnext

    volumes:
      - neo4j-data:/data
      - ./data:/var/lib/neo4j/import
      - ./cypher:/cypher:ro

volumes:
  neo4j-data:
